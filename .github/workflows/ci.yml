# CI workflow updated to include printf/fprintf guard in src/
name: MXD Library CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  BUILD_TYPE: Release

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
# Note: Upload may fail if Code Scanning is not enabled for this repository
    # This requires repository admin access to enable in Settings > Security & analysis
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libuv1-dev libcurl4-openssl-dev \
            valgrind cppcheck clang-tidy
    
      - name: Set CC/CXX to clang with sanitizers
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo 'CFLAGS=-Wno-deprecated-declarations -fsanitize=address,undefined -fno-omit-frame-pointer -O1' >> $GITHUB_ENV
          echo 'LDFLAGS=-fsanitize=address,undefined' >> $GITHUB_ENV

      - name: "Guard: fail on printf/fprintf/sprintf/vsprintf usage in src/ (excluding logging implementation)"
        run: |
          set +e
          MATCHES=$(grep -RInE '\b(printf|fprintf|sprintf|vsprintf)\s*\(' src/ | grep -v 'src/mxd_logging.c' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Found unsafe printf-family usage in src/. Replace with MXD_LOG_* or use snprintf/vsnprintf as appropriate"
            exit 1
          fi

      - name: "Guard: fail on hardcoded secrets patterns"
        run: |
          set +e
          BAD1=$(grep -RIn "0x4D584431" src/ include/ || true)
          BAD2=$(grep -RIn "MXDKeyDerivation" src/ include/ || true)
          BAD3=$(grep -RInE "memset\\s*\\(\\s*[^,]+\\s*,\\s*0xAB\\s*," src/ include/ || true)
          ALL="$BAD1$BAD2$BAD3"
          if [ -n "$ALL" ]; then
            echo "$ALL"
            echo "Found hardcoded secrets or salts. Remove them."
            exit 1
          fi
    

      - name: Install MXD dependencies
        run: ./install_dependencies.sh
    
      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TESTING=ON -DMXD_WITH_WASI=OFF
    
      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)
    
      - name: Run static analysis
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction src/
          find src/ -name "*.c" -exec clang-tidy {} -- -I include/ \;
    
      - name: Run tests
        working-directory: build
        # node_network_tests is an integration test that needs a live daemon
        # listening on a known port; not a unit test, excluded from CI.
        run: ctest --output-on-failure -E "node_network_tests"
    
      - name: Run memory tests with Valgrind (gcc only)
        if: ${{ matrix.compiler == 'gcc' }}
        working-directory: build
        run: |
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 \
            ./lib/mxd_crypto_tests
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 \
            ./lib/mxd_metrics_tests
      
      - name: Run tests with sanitizers (clang only)
        if: ${{ matrix.compiler == 'clang' }}
        working-directory: build
        run: |
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ./lib/mxd_crypto_tests
          ./lib/mxd_metrics_tests

  performance-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libuv1-dev libcurl4-openssl-dev

      - name: Install MXD dependencies
        run: ./install_dependencies.sh
    
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DMXD_WITH_WASI=OFF
          cmake --build build --config Release -j$(nproc)

      - name: Run performance tests
        working-directory: build
        run: |
          ./lib/mxd_metrics_performance_tests
    
      - name: Performance benchmark
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | Completed successfully |" >> $GITHUB_STEP_SUMMARY

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mxdlib:latest
          no-cache: true

      - name: Generate SBOM for source (CycloneDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true   # SBOM is supply-chain transparency, not gating
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          upload-artifact: false
      - name: Generate SBOM for Docker image (CycloneDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: mxdlib:latest
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        if: hashFiles('sbom-source.cdx.json', 'sbom-image.cdx.json') != ''
        with:
          name: sbom-artifacts
          path: |
            sbom-source.cdx.json
            sbom-image.cdx.json


      - name: Test Docker image
        run: |
          docker run --rm -d --name mxd-test mxdlib:latest
          sleep 10
          docker logs mxd-test
          docker stop mxd-test

      - name: Save Docker image for downstream jobs (integration-test)
        run: docker save mxdlib:latest -o mxdlib-image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxdlib-docker-image
          path: mxdlib-image.tar
          retention-days: 1


  docker-publish-sign:
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository name for GHCR
        id: lc
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (multi-arch emulation for arm64 build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lc.outputs.repo }}:${{ github.ref_name }}
            ghcr.io/${{ steps.lc.outputs.repo }}:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign container image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ steps.lc.outputs.repo }}:${{ github.ref_name }} || true
          cosign sign --yes ghcr.io/${{ steps.lc.outputs.repo }}:latest || true
      - name: Generate SBOM for pushed image (CycloneDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true   # SBOM is supply-chain transparency, not gating
        with:
          image: ghcr.io/${{ steps.lc.outputs.repo }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom-image-ghcr.cdx.json
          upload-artifact: false
      - name: Upload SBOM (GHCR image)
        uses: actions/upload-artifact@v4
        if: hashFiles('sbom-image-ghcr.cdx.json') != ''
        with:
          name: sbom-image-ghcr
          path: sbom-image-ghcr.cdx.json

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image artifact from docker-build
        uses: actions/download-artifact@v4
        with:
          name: mxdlib-docker-image
          path: .

      - name: Load Docker image
        run: |
          docker load -i mxdlib-image.tar
          docker image ls mxdlib:latest

      - name: Start 2-node test environment + wait for healthy
        run: |
          # Use the CI-tailored compose: image reuse, no monitoring stack,
          # tight healthchecks. --wait blocks until both services report
          # healthy (or timeout), replacing the fragile `sleep 30`.
          docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 90
          docker compose -f docker-compose.ci.yml ps

      - name: Verify both nodes respond to /status with valid JSON
        run: |
          # Use `docker exec` (not host curl) — host→container HTTP through
          # GitHub Actions' Docker bridge has IPv6/IPv4 quirks that cause
          # curl exit 56 (CURLE_RECV_ERROR) even when the container's
          # internal healthcheck passes. The healthcheck already validates
          # the endpoint inside the container; this step prints the actual
          # response body for visibility and asserts both nodes return JSON
          # with the expected fields.
          set -e
          for container in mxd-node-1 mxd-node-2; do
              echo "--- $container /status ---"
              body=$(docker exec "$container" curl -fs --max-time 5 http://localhost:8080/status)
              echo "$body"
              echo "$body" | grep -qE '"height"' || { echo "no height field"; exit 1; }
              echo "$body" | grep -qE '"validator_count"' || { echo "no validator_count field"; exit 1; }
          done

      - name: Capture logs (always, for debugging)
        if: always()
        run: |
          echo "--- mxd-node-1 logs ---"
          docker logs mxd-node-1 2>&1 | tail -40 || true
          echo "--- mxd-node-2 logs ---"
          docker logs mxd-node-2 2>&1 | tail -40 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test, performance-test, integration-test]
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment steps here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test steps here

  # ──────────────────────────────────────────────────────────────────────
  # Binary release: cross-arch SELF-CONTAINED tarballs as GitHub Release
  # assets. Runs ONLY on tag push (vX.Y.Z).
  #
  # Bundles mxd_node + libmxd.so + the source-built deps (libuv, libuvwasi,
  # libm3, liboqs) AND every system .so transitively required at runtime
  # (libssl, libcrypto, libsodium, librocksdb, libcurl + its sub-deps,
  # libminiupnpc, libmicrohttpd, libgmp, libcjson, libzstd, …) — basically
  # everything ldd-resolves EXCEPT glibc components (libc, libm, libpthread,
  # libdl, librt, ld-linux, vdso), which are kernel-coupled and must come
  # from the host system.
  #
  # Build runner pinned to ubuntu-22.04 (glibc 2.35). The resulting binary
  # runs on any Linux with glibc ≥ 2.35: Ubuntu 22.04+, Debian 12+, Fedora
  # 36+, Rocky 9+, openSUSE Tumbleweed, Arch (rolling), Alpine 3.18+ with
  # gcompat. No apt prereq from letsgo — the bundle is fully portable.
  # ──────────────────────────────────────────────────────────────────────
  build-binary-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    permissions:
      contents: write     # upload release assets
      id-token: write     # cosign keyless signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            triplet: linux-x86_64
            libdir: /usr/lib/x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: aarch64
            triplet: linux-arm64
            libdir: /usr/lib/aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libcurl4-openssl-dev libminiupnpc-dev libmicrohttpd-dev \
            libgmp-dev libc-bin

      - name: Build source-built deps + libmxd + mxd_node
        run: |
          # Runs the same install_dependencies script the manual letsgo
          # path uses — yields liboqs, libuv, libuvwasi, libm3 in
          # /usr/local/lib, then builds libmxd + mxd_node into ./build/.
          chmod +x install_dependencies.sh install_dependencies_linux.sh
          ./install_dependencies.sh
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc) mxd_node

      - name: Stage release bundle (recursive ldd, glibc excluded)
        run: |
          set -euo pipefail
          STAGE="mxd-${{ github.ref_name }}-${{ matrix.triplet }}"
          mkdir -p "$STAGE/bin" "$STAGE/lib"

          # Our artifacts
          cp build/lib/mxd_node       "$STAGE/bin/"
          cp build/lib/libmxd.so      "$STAGE/lib/"

          # Recursive .so bundler. Walks ldd on mxd_node + libmxd.so, then
          # on each newly-bundled .so, until fixed point. Skips glibc
          # components (kernel-coupled, must come from host) and the linker
          # itself.
          should_skip() {
              case "$1" in
                  */libc.so.*|*/libc-*|*/libm.so.*|*/libm-*) return 0 ;;
                  */libpthread.so.*|*/libpthread-*) return 0 ;;
                  */libdl.so.*|*/libdl-*) return 0 ;;
                  */librt.so.*|*/librt-*) return 0 ;;
                  */libresolv.so.*) return 0 ;;
                  */libnsl.so.*) return 0 ;;
                  */libutil.so.*) return 0 ;;
                  */ld-linux*|*linux-vdso*) return 0 ;;
                  *) return 1 ;;
              esac
          }

          bundle_one() {
              local src="$1"
              local base
              base="$(basename "$src")"
              [ -e "$STAGE/lib/$base" ] && return 0    # already bundled
              cp -L "$src" "$STAGE/lib/$base"          # follow symlinks → real file
              # Recurse: ldd the just-bundled lib and bundle its deps too
              local dep
              while IFS= read -r dep; do
                  [ -z "$dep" ] && continue
                  should_skip "$dep" && continue
                  bundle_one "$dep"
              done < <(ldd "$STAGE/lib/$base" 2>/dev/null | awk '/=> \// {print $3}')
          }

          # Seed with mxd_node + libmxd.so (libmxd already copied above).
          while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              should_skip "$dep" && continue
              bundle_one "$dep"
          done < <(ldd "$STAGE/bin/mxd_node" 2>/dev/null | awk '/=> \// {print $3}')

          # libmxd.so itself wasn't bundled by the recursion (we put it
          # directly). Run ldd on it too to catch any extra deps.
          while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              should_skip "$dep" && continue
              bundle_one "$dep"
          done < <(LD_LIBRARY_PATH="$STAGE/lib" ldd "$STAGE/lib/libmxd.so" 2>/dev/null | awk '/=> \// {print $3}')

          # Recreate SONAME symlinks. cp -L gave us the real files; many
          # libs are loaded by short SONAME (libssl.so.3 → libssl.so.3.x.y).
          # Build the chain: libfoo.so.X.Y.Z → libfoo.so.X → libfoo.so
          ( cd "$STAGE/lib" && \
            for real in *.so.*.*; do
                [ -f "$real" ] || continue
                # libssl.so.3.0.2 → soname libssl.so.3
                soname=$(echo "$real" | sed -E 's/(\.so\.[0-9]+).*/\1/')
                [ -e "$soname" ] || ln -s "$real" "$soname"
                base=$(echo "$real" | sed -E 's/(\.so)\..*/\1/')
                [ -e "$base" ] || ln -s "$soname" "$base"
            done
          )

          echo "Bundle libs:"
          ls -lh "$STAGE/lib/" | head -30

          # Operator-facing helper to launch the node with the bundled
          # libs resolved via LD_LIBRARY_PATH — no global install, no apt.
          cat > "$STAGE/bin/mxd_node_run" <<'WRAP'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}" exec "$DIR/bin/mxd_node" "$@"
          WRAP
          chmod +x "$STAGE/bin/mxd_node_run"

          # Default config + the network-switch helper so testnet/mainnet
          # selection works out of the box.
          mkdir -p "$STAGE/config"
          cp src/node/default_config.json "$STAGE/config/"
          cp switch_network.sh "$STAGE/" 2>/dev/null || true

          # README that documents the bundle layout — fully self-contained.
          cat > "$STAGE/README.md" <<README
          # MXD prebuilt bundle — ${{ github.ref_name }} (${{ matrix.triplet }})

          ## Quick start

              # 1. Pick a network:
              ./switch_network.sh config/default_config.json testnet

              # 2. Start the node:
              ./bin/mxd_node_run config/default_config.json --http-api 8080

          That's it. The \`mxd_node_run\` wrapper sets LD_LIBRARY_PATH so
          every runtime dependency (libssl, libsodium, librocksdb, libcurl,
          libuv, libuvwasi, libm3, liboqs, …) is loaded from the bundled
          \`lib/\` directory. No \`apt install\` required.

          ## Requirements

          - Linux kernel ≥ 5.4
          - glibc ≥ 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+, Rocky 9+,
            openSUSE Tumbleweed, Arch, Alpine 3.18+ with gcompat).
          - For \`--http-api\`: port 8080 free; for P2P: port 8000.

          See https://github.com/${{ github.repository }} for full docs.
          README

          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "Bundle ready: ${STAGE}.tar.gz"
          ls -lh "${STAGE}.tar.gz"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign bundle with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          STAGE="mxd-${{ github.ref_name }}-${{ matrix.triplet }}"
          cosign sign-blob --yes \
            --output-signature "${STAGE}.tar.gz.sig" \
            --output-certificate "${STAGE}.tar.gz.cert" \
            "${STAGE}.tar.gz"

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triplet }}
          path: |
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.sha256
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.sig
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.cert

  # ──────────────────────────────────────────────────────────────────────
  # Collect per-arch bundles + create the GitHub Release with all assets.
  # ──────────────────────────────────────────────────────────────────────
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    # Only gates on the binary tarballs — Docker publishing is independent.
    # If GHCR push has trouble (e.g., the lowercase-tag bug), we still want
    # the GitHub Release to land with the tarballs so letsgo --prebuilt works.
    needs: [build-binary-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: bundle-*
          merge-multiple: true

      - name: Combine SHA256SUMS
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS
          ls -lh

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Pull the section between "## [${TAG#v}]" and the next "## [" line.
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          awk "/^## \\[${VER}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "Release ${TAG}" > NOTES.md
          fi
          echo "notes_path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with bundles + signatures
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MXD ${{ github.ref_name }}
          body_path: NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/*.tar.gz.sig
            release-assets/*.tar.gz.cert
            release-assets/SHA256SUMS
