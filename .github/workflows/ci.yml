# CI workflow updated to include printf/fprintf guard in src/
name: MXD Library CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  BUILD_TYPE: Release

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
# Note: Upload may fail if Code Scanning is not enabled for this repository
    # This requires repository admin access to enable in Settings > Security & analysis
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libuv1-dev libcurl4-openssl-dev \
            valgrind cppcheck clang-tidy
    
      - name: Set CC/CXX to clang with sanitizers
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo 'CFLAGS=-Wno-deprecated-declarations -fsanitize=address,undefined -fno-omit-frame-pointer -O1' >> $GITHUB_ENV
          echo 'LDFLAGS=-fsanitize=address,undefined' >> $GITHUB_ENV

      - name: "Guard: fail on printf/fprintf/sprintf/vsprintf usage in src/ (excluding logging implementation)"
        run: |
          set +e
          MATCHES=$(grep -RInE '\b(printf|fprintf|sprintf|vsprintf)\s*\(' src/ | grep -v 'src/mxd_logging.c' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Found unsafe printf-family usage in src/. Replace with MXD_LOG_* or use snprintf/vsnprintf as appropriate"
            exit 1
          fi

      - name: "Guard: fail on hardcoded secrets patterns"
        run: |
          set +e
          BAD1=$(grep -RIn "0x4D584431" src/ include/ || true)
          BAD2=$(grep -RIn "MXDKeyDerivation" src/ include/ || true)
          BAD3=$(grep -RInE "memset\\s*\\(\\s*[^,]+\\s*,\\s*0xAB\\s*," src/ include/ || true)
          ALL="$BAD1$BAD2$BAD3"
          if [ -n "$ALL" ]; then
            echo "$ALL"
            echo "Found hardcoded secrets or salts. Remove them."
            exit 1
          fi
    

      - name: Install MXD dependencies
        run: ./install_dependencies.sh
    
      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
          cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TESTING=ON -DMXD_WITH_WASI=OFF
    
      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)
    
      - name: Run static analysis
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction src/
          find src/ -name "*.c" -exec clang-tidy {} -- -I include/ \;
    
      - name: Run tests
        working-directory: build
        # node_network_tests is an integration test that needs a live daemon
        # listening on a known port; not a unit test, excluded from CI.
        run: ctest --output-on-failure -E "node_network_tests"
    
      - name: Run memory tests with Valgrind (gcc only)
        if: ${{ matrix.compiler == 'gcc' }}
        working-directory: build
        run: |
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 \
            ./lib/mxd_crypto_tests
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 \
            ./lib/mxd_metrics_tests
      
      - name: Run tests with sanitizers (clang only)
        if: ${{ matrix.compiler == 'clang' }}
        working-directory: build
        run: |
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ./lib/mxd_crypto_tests
          ./lib/mxd_metrics_tests

  performance-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libuv1-dev libcurl4-openssl-dev

      - name: Install MXD dependencies
        run: ./install_dependencies.sh
    
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON -DMXD_WITH_WASI=OFF
          cmake --build build --config Release -j$(nproc)

      - name: Run performance tests
        working-directory: build
        run: |
          ./lib/mxd_metrics_performance_tests
    
      - name: Performance benchmark
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | Completed successfully |" >> $GITHUB_STEP_SUMMARY

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mxdlib:latest
          no-cache: true

      - name: Generate SBOM for source (CycloneDX)
        uses: anchore/sbom-action@v0.15.8
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          upload-artifact: false
      - name: Generate SBOM for Docker image (CycloneDX)
        uses: anchore/sbom-action@v0.15.8
        with:
          image: mxdlib:latest
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-source.cdx.json
            sbom-image.cdx.json


      - name: Test Docker image
        run: |
          docker run --rm -d --name mxd-test mxdlib:latest
          sleep 10
          docker logs mxd-test
          docker stop mxd-test


  docker-publish-sign:
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (multi-arch emulation for arm64 build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign container image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.ref_name }} || true
          cosign sign --yes ghcr.io/${{ github.repository }}:latest || true
      - name: Generate SBOM for pushed image (CycloneDX)
        uses: anchore/sbom-action@v0.15.8
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom-image-ghcr.cdx.json
          upload-artifact: false
      - name: Upload SBOM (GHCR image)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image-ghcr
          path: sbom-image-ghcr.cdx.json

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
      - uses: actions/checkout@v4
      - name: Start test environment
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 30
    
      - name: Run integration tests
        run: |
          # Test that containers start successfully
          docker compose -f docker-compose.test.yml ps
          # Test that nodes are running (check logs for startup messages)
          docker logs mxd-node-1 | grep "Node started successfully" || echo "Node 1 startup check"
          docker logs mxd-node-2 | grep "Node started successfully" || echo "Node 2 startup check"
          
          # Test basic container connectivity
          docker exec mxd-node-1 echo "Node 1 responsive"
          docker exec mxd-node-2 echo "Node 2 responsive"
    
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test, performance-test, integration-test]
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment steps here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test steps here

  # ──────────────────────────────────────────────────────────────────────
  # Binary release: cross-arch tarballs published as GitHub Release assets.
  # Runs ONLY on tag push (vX.Y.Z). Bundles mxd_node + libmxd.so + the
  # source-built deps that letsgo would otherwise compile from scratch
  # (libuv, libuvwasi, libm3/wasm3, liboqs) so end operators just download
  # + extract + run instead of waiting 10-20 min for compilation.
  # System libs (libssl3, libsodium23, librocksdb, etc.) are NOT bundled
  # — they ship on every supported Ubuntu and letsgo installs them via
  # apt as a one-line prereq check.
  # ──────────────────────────────────────────────────────────────────────
  build-binary-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    permissions:
      contents: write     # upload release assets
      id-token: write     # cosign keyless signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            triplet: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            triplet: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libsodium-dev librocksdb-dev libcjson-dev \
            libcurl4-openssl-dev libminiupnpc-dev libmicrohttpd-dev \
            libgmp-dev libc-bin

      - name: Build source-built deps + libmxd + mxd_node
        run: |
          # Runs the same install_dependencies script the manual letsgo
          # path uses — yields liboqs, libuv, libuvwasi, libm3 in
          # /usr/local/lib, then builds libmxd + mxd_node into ./build/.
          chmod +x install_dependencies.sh install_dependencies_linux.sh
          ./install_dependencies.sh
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc) mxd_node

      - name: Stage release bundle
        run: |
          set -euo pipefail
          STAGE="mxd-${{ github.ref_name }}-${{ matrix.triplet }}"
          mkdir -p "$STAGE/bin" "$STAGE/lib"

          # Our artifacts
          cp build/lib/mxd_node       "$STAGE/bin/"
          cp build/lib/libmxd.so      "$STAGE/lib/"

          # Source-built deps that aren't in apt — bundle so the operator
          # doesn't need to recompile them. Wildcards cover .so / .so.N /
          # .so.N.M.K symlinks; cp -P preserves symlinks.
          for so in libuv libuvwasi libm3 liboqs; do
            cp -P /usr/local/lib/${so}.so* "$STAGE/lib/" 2>/dev/null || true
          done

          # Operator-facing helper to launch the node with the bundled
          # libs resolved via LD_LIBRARY_PATH — no global install needed.
          cat > "$STAGE/bin/mxd_node_run" <<'WRAP'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}" exec "$DIR/bin/mxd_node" "$@"
          WRAP
          chmod +x "$STAGE/bin/mxd_node_run"

          # Default config + the network-switch helper so testnet/mainnet
          # selection works out of the box.
          mkdir -p "$STAGE/config"
          cp src/node/default_config.json "$STAGE/config/"
          cp switch_network.sh "$STAGE/" 2>/dev/null || true

          # README that documents the bundle layout + apt prereq line.
          cat > "$STAGE/README.md" <<README
          # MXD prebuilt bundle — ${{ github.ref_name }} (${{ matrix.triplet }})

          ## Quick start

              # 1. Install runtime system libs (one-time, Ubuntu/Debian):
              sudo apt-get install -y libssl3 libsodium23 librocksdb6.11 \\
                  libcjson1 libcurl4 libminiupnpc17 libmicrohttpd12 libgmp10

              # 2. Pick a network + start:
              ./switch_network.sh config/default_config.json testnet
              ./bin/mxd_node_run config/default_config.json --http-api 8080

          The \`mxd_node_run\` wrapper sets LD_LIBRARY_PATH so the bundled
          libuv/libuvwasi/libm3/liboqs are found without a global install.

          See https://github.com/${{ github.repository }} for full docs.
          README

          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "Bundle ready: ${STAGE}.tar.gz"
          ls -lh "${STAGE}.tar.gz"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign bundle with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          STAGE="mxd-${{ github.ref_name }}-${{ matrix.triplet }}"
          cosign sign-blob --yes \
            --output-signature "${STAGE}.tar.gz.sig" \
            --output-certificate "${STAGE}.tar.gz.cert" \
            "${STAGE}.tar.gz"

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.triplet }}
          path: |
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.sha256
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.sig
            mxd-${{ github.ref_name }}-${{ matrix.triplet }}.tar.gz.cert

  # ──────────────────────────────────────────────────────────────────────
  # Collect per-arch bundles + create the GitHub Release with all assets.
  # ──────────────────────────────────────────────────────────────────────
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binary-release, docker-publish-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: bundle-*
          merge-multiple: true

      - name: Combine SHA256SUMS
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS
          ls -lh

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Pull the section between "## [${TAG#v}]" and the next "## [" line.
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          awk "/^## \\[${VER}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "Release ${TAG}" > NOTES.md
          fi
          echo "notes_path=NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with bundles + signatures
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MXD ${{ github.ref_name }}
          body_path: NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/*.tar.gz.sig
            release-assets/*.tar.gz.cert
            release-assets/SHA256SUMS
