name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-c:
    name: Build libmxd + run C tests (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Cache the from-source builds (liboqs, libuv, uvwasi, wasm3) under
      # /usr/local. The install script is idempotent; if the cache hits, it
      # skips re-building each library and the CI run shaves ~8-10 minutes.
      - name: Restore cached from-source dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/liboqs.so*
            /usr/local/lib/libuv.so*
            /usr/local/lib/libuvwasi.so*
            /usr/local/lib/libm3.so*
            /usr/local/include/oqs
            /usr/local/include/uv*
            /usr/local/include/wasm3.h
            /usr/local/lib/cmake/wasm3
          key: linux-deps-${{ hashFiles('install_dependencies_linux.sh') }}

      - name: Install dependencies
        run: |
          chmod +x install_dependencies_linux.sh
          ./install_dependencies_linux.sh
          sudo ldconfig

      - name: Configure (CMake)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: |
          ctest --output-on-failure --no-tests=error

  contracts:
    name: Hardhat compile + test (Solidity)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test
